schema: spec-driven

context: |
  Tech stack: Python package `profilekit` (src layout, `src/profilekit/`),
  packaged via `pyproject.toml` and exposed as the `profile` CLI
  (`profilekit.cli:main`). An adopting project declares its layout in
  `profile.toml`; its canonical data lives in `data/*.json` and is validated
  against the JSON Schemas (draft-07) shipped in `src/profilekit/schemas/`.
  Architecture: data-driven pipeline with a single source of truth in
  `data/`. Generators (`src/profilekit/generate_*.py`) are pure transforms
  that write only into `output/`, which carries a `manifest.json` contract.
  Publishers (`src/profilekit/publishers/`, run by `publish.py`) copy
  artifacts to destinations declared under `[publishers.*]`; publishing is a
  dry run unless `--execute` is given. Both kinds are discovered through the
  `profilekit.generators` and `profilekit.publishers` entry-point groups
  (`registry.py`), and every file write in `src/` goes through `safe_io.py`.
  The in-repo Next.js portfolio at `apps/portfolio/` is a reference consumer
  of the published data (an in-monorepo consumer, not an external project).
  Testing: Strict TDD is ACTIVE for this project. RED-GREEN-REFACTOR is required
  for every behavioral change. The pytest suite lives under `tests/` (unit) and
  `tests/e2e/` (end to end), with an 80% coverage gate configured in
  `pyproject.toml`; run it via `uv run pytest -q`. mypy runs in strict mode
  and ruff includes the BLE, S, TRY and PT rule sets.
  Style: Additive, backward-compatible changes preferred. New data fields are
  optional and never added to schema `required`. Generators use
  use-if-present-else-fallback semantics so existing data keeps rendering
  unchanged. This rule scopes to the data and output contracts; it does not
  cover the Python import surface, which may change without a deprecation
  window ahead of the first PyPI release.

rules:
  proposal:
    - State the WHY and high-level WHAT; keep implementation detail in design.
    - Include a scope/artifacts table and explicit non-goals.
    - Include rollback plan for risky changes.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Each requirement MUST have at least one scenario.
  design:
    - Document architecture decisions with rationale.
    - Include sequence diagrams for complex flows.
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
    - Under strict TDD, write the failing test task before the implementation task.
  apply:
    guidelines:
      - Follow existing code patterns in src/profilekit/ and data/.
      - Keep all new data fields optional and backward-compatible.
      - Preserve existing generator output when new fields are absent.
    tdd: true
    # pytest suite lives in tests/ (testpaths in pyproject.toml); run via uv.
    test_command: "uv run pytest -q"
  verify:
    # pytest suite lives in tests/ (testpaths in pyproject.toml); run via uv.
    test_command: "uv run pytest -q"
    # No compiled build step for the Python pipeline; generators emit output/ directly.
    build_command: ""
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas.
