name: Bug report
description: Something in profilekit does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran and a minimal profile.toml / data file if relevant.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: profilekit version
      description: Output of `pip show profilekit`, or the commit you installed from.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: Python 3.12, Ubuntu 24.04
    validations:
      required: true
