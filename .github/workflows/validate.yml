name: Validate Profile Data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Python 3.11 is used instead of 3.14 because jsonschema binary
          # wheels are reliably available for 3.11 on all CI runners.
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        env:
          SKIP_ICON_CHECK: "1"
        run: python -m pytest -q

      - name: Validate data files
        env:
          SKIP_ICON_CHECK: "1"
        run: python generators/validate.py
