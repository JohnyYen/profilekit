name: Validate Profile Data

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "tests/**"
      - "output/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "tests/**"
      - "output/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Network reachability checks are non-fatal and skipped in CI to avoid flakiness.
      SKIP_ICON_CHECK: "1"
      SKIP_LINK_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          # Python 3.11 is pinned because jsonschema binary wheels are
          # reliably available for 3.11 on all CI runners.
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests + coverage
        run: uv run pytest -q --ignore=tests/e2e

      # Run separately so a packaging failure is distinguishable from a unit
      # failure at a glance. These build the wheel and install it into a fresh
      # interpreter, which is the only way to catch package data that was
      # never declared or an entry point that resolves solely because the
      # checkout happens to be importable.
      - name: End-to-end (installed package)
        run: uv run pytest tests/e2e -q --no-cov

      - name: Validate data files
        run: uv run python -m profilekit.cli validate

      - name: Output freshness (generated output must match committed output)
        run: |
          uv run python -m profilekit.cli generate
          git diff --exit-code -- output/
