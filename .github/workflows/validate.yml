name: Validate Profile Data

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "generators/**"
      - "schemas/**"
      - "tests/**"
      - "cv/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "generators/**"
      - "schemas/**"
      - "tests/**"
      - "cv/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          # Python 3.11 is pinned because jsonschema binary wheels are
          # reliably available for 3.11 on all CI runners.
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pytest
        env:
          SKIP_ICON_CHECK: "1"
        run: uv run pytest -q

      - name: Validate data files
        env:
          SKIP_ICON_CHECK: "1"
        run: uv run python generators/validate.py
