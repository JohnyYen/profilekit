name: Build Portfolio

on:
  push:
    branches: [main]
    paths:
      - "apps/portfolio/**"
      - ".github/workflows/portfolio.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/portfolio/**"
      - ".github/workflows/portfolio.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portfolio
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/portfolio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publish the canonical data into the app before building, so the
      # reference consumer is proven against freshly generated output rather
      # than whatever happened to be committed. This is the end-to-end proof
      # that the data contract actually works: if a transform drops a field
      # the app reads, the build fails here instead of in production.
      # `working-directory` is only honoured on `run` steps, so the action
      # itself needs no override; the job default only affects the shell.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Publish canonical data into the app
        working-directory: ${{ github.workspace }}
        # `--locked` so the job fails on a lockfile that disagrees with the
        # project metadata instead of silently re-resolving and building the
        # app against dependencies nobody committed.
        run: |
          uv sync --locked --extra dev
          uv run profile --offline generate
          uv run profile --offline publish portfolio-data --execute

      - name: Fail if the committed app data differed from a fresh publish
        working-directory: ${{ github.workspace }}
        # `git status --porcelain` rather than `git diff --exit-code`: diff
        # compares tracked files only, so a publish that emits a *new*
        # artifact nobody committed would exit 0 and the app would build on
        # data that exists only in CI.
        run: |
          drift=$(git status --porcelain -- apps/portfolio/app/data/)
          if [ -n "$drift" ]; then
            echo "committed app data differs from a fresh publish:" >&2
            echo "$drift" >&2
            echo >&2
            # Porcelain names the files but not what changed in them, which is
            # the question a reader actually has. Print the hunks too; a new
            # untracked file shows above but has no diff, which is why
            # porcelain remains the gate.
            git --no-pager diff -- apps/portfolio/app/data/ >&2 || true
            exit 1
          fi

      # `pnpm build` works again now that pnpm-workspace.yaml answers the
      # native-build question with real booleans instead of the placeholder
      # text it used to carry. The previous workaround invoked next directly
      # to dodge ERR_PNPM_IGNORED_BUILDS; the cause is fixed, so the
      # workaround is gone.
      - name: Build
        run: pnpm build
