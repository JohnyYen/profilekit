# profilekit project configuration.
#
# This repository is the reference project: it is both the tool's own
# development checkout and the first consumer of the tool. The values below
# reproduce exactly the paths that were previously derived from each module's
# __file__ location, so the cutover to working-directory discovery is a
# behavior-preserving change.

[project]
config_version = 1

[paths]
data = "data"
output = "output"
assets = "assets"
# schemas is intentionally omitted: the JSON Schemas ship as package data
# inside the distribution, so an installed CLI resolves them without needing
# a checkout. Set it only to validate against project-local schemas instead.

[generators.cv]
# Pinned so the committed output/ and the golden snapshots stay reproducible.
# The default is "auto", which lets RenderCV resolve the date at render time —
# correct for most projects, but non-deterministic, and this repository asserts
# byte-identical output in CI.
current_date = "2026-07-30"

[publishers.portfolio-data]
# The in-repo Next.js portfolio is a reference *consumer* of this data, not
# part of the distributed package. Any frontend reading the same four JSON
# shapes is an equally valid destination.
kind = "filesystem"
destination = "apps/portfolio/app/data"

[publishers.linkedin]
# LinkedIn exposes no write access to profile fields without partner-level
# API approval, so this destination is manual by capability, not by choice:
# it emits the artifact and reports the pending action. It never reports a
# publish it did not perform.
kind = "manual"
artifacts = ["linkedin.md"]

# The repositories that serve the generated artifacts. Commented out until the
# owner reviews the destination paths and runs the first publish: a first
# publish into a repository edited by hand fails with a conflict by design,
# and `on_conflict = "overwrite"` is a deliberate, one-time choice. Check each
# destination path against the repository's real layout before enabling it.
#
# [publishers.profile-readme]
# kind = "git-repo"
# repo = "JohnyYen/JohnyYen"
# message = "chore: refresh profile README"
#
# [publishers.profile-readme.files]
# "README.md" = "github-readme.md"
# "assets/pixel-mario.gif" = "assets/pixel-mario.gif"
#
# [publishers.cv-repo]
# kind = "git-repo"
# repo = "JohnyYen/my-cv"
# message = "chore: refresh CV sources"
#
# [publishers.cv-repo.files]
# "cv.yml" = "cv.yml"
# "cv.md" = "cv.md"
#
# [publishers.portfolio-repo]
# kind = "git-repo"
# repo = "JohnyYen/my-portfolio-terminal"
# message = "chore: refresh portfolio data"
#
# [publishers.portfolio-repo.files]
# "app/data/about.json" = "apps/portfolio/app/data/about.json"
# "app/data/social.json" = "apps/portfolio/app/data/social.json"
# "app/data/skills.json" = "apps/portfolio/app/data/skills.json"
# "app/data/projects.json" = "apps/portfolio/app/data/projects.json"
# "app/data/manifest.json" = "apps/portfolio/app/data/manifest.json"
