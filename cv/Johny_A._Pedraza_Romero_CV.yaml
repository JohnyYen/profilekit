    experience:
      - company: Medialityc
        position: Backend Developer
        date:
        start_date: 2024-10
        end_date: 2025-07
        location: La Habana, CU
        summary: Completed backend development training in .NET and FastAPI, focusing on a generalization-oriented development approach and the design of robust, project-aligned architectures.
        highlights:
          - Developed the backend for a foodie community platform using .NET, applying a scalable architecture design based on Clean Architecture and a generalization-oriented development approach.
          - Developed a backend using FastAPI for a photo monetization mobile application, integrated with an OCR model for image interpretation and analysis.
      
      - company: Avangenio
        position: Frappe Developer
        date:
        start_date: 2025-05
        end_date: present
        location: La Habana, CU
        summary: Currently responsible for developing new features using Python and JavaScript for custom ERPNext applications.
        highlights:
          - Designed and implemented custom functionalities in ERPNext, enhancing system adaptability to business workflows.
          - Led a team as team leader during Avangenio's internal hackathon, building a custom Frappe-based application that acts as a fully customizable assistant, allowing end users to dynamically create the tools they need.
          - Leading the integration with Facel, a Cuban electronic invoicing API, as a key milestone for the application.
    projects:
      - name: "[NestJS Boilerplate](https://github.com/JohnyYen/NestJs-Template)"
        date:
        start_date: 2025-08
        end_date: 2025-10
        location:
        summary: Complete boilerplate for NestJS projects with Prisma ORM
        highlights:
          - Modular and scalable architecture with organized folder structure
          - Integrated Prisma ORM configuration with migrations and seeding
          - Generic base controllers, services, and repositories
          - Centralized app configuration and DTOs for pagination/responses
          - Production-ready setup with Swagger auto-documentation
          - Custom exception handling and decorators

      - name: "[FastAPI Template](https://github.com/JohnyYen/fastapi-template)"
        date:
        start_date: 2025-07
        end_date: 2025-08
        location:
        summary: Base template for creating fast, scalable APIs with FastAPI
        highlights:
          - JWT authentication integrated
          - SQLAlchemy async configuration with Alembic migrations
          - Pydantic schemas for data validation
          - Complete CRUD implementation with Repository pattern
          - Testing configuration with pytest
          - Docker and Docker Compose ready for deployment
          - Automatic documentation with Swagger UI and ReDoc

      - name: "[Ignix Core](https://github.com/JohnyYen/ignix-core)"
        date:
        start_date: 2026-01
        end_date: 2026-02
        location:
        summary: TypeScript package for building type-safe, extensible services with Result pattern and ORM-agnostic repositories
        highlights:
          - Implements Result pattern for explicit success/failure handling, improving reliability
          - Provides generic services (IService<T>) with CRUD operations and customizable DTOs
          - ORM-agnostic repository interface supporting TypeORM, Prisma, and Sequelize
          - Framework-flexible API handlers with adapters for NestJS, Express, Fastify, and Hono
          - Promotes SOLID principles and type safety to reduce bugs and improve maintainability

      - name: "FastAPI Generic Scaffold"
        date:
        start_date: 2026-07
        end_date:
        location:
        summary: A fully generic FastAPI scaffold architected with Screaming Architecture and Clean Architecture, featuring an automated scaffolding script that generates complete, production-ready modules — repository, service, and API layers — out of the box. The generic core is extensible through a Builder pattern, allowing custom wrappers at any layer, making it adaptable to virtually any backend domain. Includes a customizable built-in admin panel.
        highlights:
          - Architected with Screaming Architecture and Clean Architecture for domain-driven module organization
          - Automated scaffolding script generates ready-to-use modules with full repository, service, and API layers
          - Extensible core with Builder pattern for adding custom wrappers at repo, service, or controller level
          - Built-in customizable admin panel
          - Designed for adaptability across any backend domain

      - name: "Educational Game-Based Learning Platform (Thesis)"
        date:
        start_date: 2026-01
        end_date: 2026-07
        location:
        summary: A game-based educational platform designed to integrate with multiple video game types for programming learning. Features analytics dashboards to track student performance, course management, and teacher controls for customizing learning paths. Built with an adaptive architecture that enables seamless integration of diverse game genres while collecting and analyzing learning analytics in real time.
        highlights:
          - Multi-game integration architecture supporting diverse video game genres for programming education
          - Analytics dashboards for real-time student performance tracking and learning insights
          - Course management system with teacher-controlled adaptive learning paths
          - Scalable architecture designed for extensibility to new game types and analytics modules
