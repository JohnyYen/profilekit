[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "profilekit"
version = "0.1.0"
description = "Turn structured profile data (JSON) into generated artifacts (GitHub README, LinkedIn copy, CV, portfolio data) and optionally publish them to real destinations."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Johny A. Pedraza Romero", email = "johny.antonio.pedraza.romero@gmail.com" },
]
keywords = ["profile", "cv", "readme-generator", "static-site", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
# pyyaml is a dev dependency because the CI-workflow tests parse the
# workflow YAML. Without it declared they would silently skip, and a
# skipped test that reads as green is worse than a failing one.
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    # Stubs for the one runtime dependency, so `mypy --strict` type-checks
    # jsonschema calls instead of treating the module as Any.
    "types-jsonschema",
    "pytest-cov>=5",
    "pre-commit>=3",
    "pyyaml>=6",
    # The end-to-end suite builds the distribution before installing it.
    "build>=1",
    "mutmut>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/JohnyYen/profile-data"
Repository = "https://github.com/JohnyYen/profile-data"
Issues = "https://github.com/JohnyYen/profile-data/issues"
Changelog = "https://github.com/JohnyYen/profile-data/blob/main/CHANGELOG.md"

[project.scripts]
profile = "profilekit.cli:main"
profilekit = "profilekit.cli:main"

# Components are discovered through these two groups and nowhere else. A
# third-party package registers its own the same way, with no edit to
# profilekit. The split between the groups is what enforces the boundary:
# `generate` resolves only generators, `publish` only publishers.
[project.entry-points."profilekit.generators"]
github-readme = "profilekit.generate_github_readme:main"
linkedin = "profilekit.generate_linkedin:main"
portfolio = "profilekit.generate_portfolio:main"
cv = "profilekit.generate_cv:main"

# The package registers its own publishers too, under destination-flavoured
# names, so they show up in `registry.publishers()` and can be used directly as
# a destination `kind` (`kind = "portfolio-data"` behaves like
# `kind = "filesystem"`, `kind = "linkedin"` like `kind = "manual"`).
# `publish._load_publisher` resolves these two entries to their native
# classes, so the `publish_entry_point` callables only run when something
# outside profilekit loads the entry point and calls it.
[project.entry-points."profilekit.publishers"]
portfolio-data = "profilekit.publishers.filesystem:publish_entry_point"
linkedin = "profilekit.publishers.manual:publish_entry_point"

# src-layout: the import package lives under src/profilekit, decoupled from
# the distribution name. `pip install .` / `pip install -e .` makes the
# `profile` console script resolve with no pythonpath hacks required.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
profilekit = ["py.typed", "schemas/*.schema.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Only the Python package + tests are linted here. The in-repo Next.js app
# (apps/) and RenderCV config (cv/) have their own toolchains.
extend-exclude = ["apps", "cv", "openspec", "output", "data", "assets"]

[tool.ruff.lint]
# BLE, S and TRY target unhandled errors and over-broad exception handling;
# PT keeps pytest idioms consistent in tests/.
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "S", "TRY", "PT"]
# TRY003 asks for messages to be built inside custom exception classes. Every
# raise here carries site-specific context (file, field, destination, path),
# which is the point of the message; moving it into dozens of one-use classes
# would add types without adding information.
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# generate_all.py intentionally bootstraps sys.path before importing the
# profilekit package, so its imports are not at the top of the file.
"src/profilekit/generate_all.py" = ["E402"]
# These two modules exist to probe URLs. `_check_url` rejects every scheme but
# http(s) before building a Request, so S310's file:/custom-scheme concern is
# handled at the one place both call sites pass through.
"src/profilekit/icons.py" = ["S310"]
"src/profilekit/links.py" = ["S310"]
# Test docstrings are descriptive and allowed to exceed the line length.
#
# In tests: S101 because pytest asserts are the assertion mechanism; S603/S607
# because subprocess calls run fixed argument lists (git, the interpreter, the
# built CLI) chosen by the test, never external input; S105/S108 because
# fake tokens and literal paths are fixtures, never real secrets or temp
# files; TRY because test doubles raise ad-hoc exceptions on purpose to drive
# the code under test down its error paths.
"tests/*" = ["E501", "S101", "S105", "S108", "S603", "S607", "TRY"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/"]

[tool.mutmut]
# Mutation testing (see docs/quality/mutation-baseline.md). Only the package is
# mutated; the end-to-end suite is excluded because it builds and installs the
# distribution, which is far too slow to repeat once per mutant. `--no-cov`
# drops the coverage gate from `addopts`: a partial selection of tests would
# otherwise fail it and abort the clean run.
source_paths = ["src/profilekit/"]
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]
# The deselected test inspects generator signatures, which mutmut replaces
# with its own trampolines; it fails on the mutated copy before any mutant runs.
pytest_add_cli_args_test_selection = [
    "tests/",
    "--ignore=tests/e2e",
    "--deselect=tests/test_generator_output_boundary.py::test_every_generator_accepts_an_explicit_output_dir",
]
# Several unit tests read repository files next to the package (sample data,
# docs, CI workflows, the Next.js app's data contract), so they are copied into
# mutmut's working copy as well.
also_copy = [
    "data", "docs", "output", "assets", "apps", "cv", ".github",
    "README.md", "CONTRIBUTING.md", "CHANGELOG.md", "SECURITY.md", "CODE_OF_CONDUCT.md",
    "LICENSE", "MANIFEST.in", "profile.toml", ".pre-commit-config.yaml", ".gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=profilekit --cov-report=term-missing --cov-fail-under=80"
