[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "pytest-cov>=5", "pre-commit>=3"]

# This project is a collection of scripts run via pythonpath, not a
# distributable package, so setuptools should not try to package any source.
[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["generators", "tests"]
# Only the Python generators + tests are linted here. The in-repo Next.js app
# (apps/) and RenderCV config (cv/) have their own toolchains.
extend-exclude = ["apps", "cv", "openspec", "output", "data", "schemas", "assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# generate_all.py intentionally bootstraps sys.path before importing the
# generators package, so its imports are not at the top of the file.
"generators/generate_all.py" = ["E402"]
# Test docstrings are descriptive and allowed to exceed the line length.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["generators/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=generators --cov-report=term-missing --cov-fail-under=80"
